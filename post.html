<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add — Noctiluca</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #111009;
      --bg-card: #1a1814;
      --text: #e8e0cc;
      --text-muted: #8a8070;
      --gold: #c8a96e;
      --gold-dim: #7a6540;
      --border: #2a2620;
      --border-light: #3a3428;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.5rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, var(--bg) 60%, transparent);
    }

    .site-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
    }

    nav a {
      font-family: 'Inconsolata', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    nav a:hover { color: var(--gold); }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 7rem 2rem 4rem;
    }

    .form-title {
      font-family: 'Inconsolata', monospace;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 2.5rem;
    }

    .group { margin-bottom: 1.5rem; }

    label {
      display: block;
      font-family: 'Inconsolata', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    input[type=text], input[type=password], input[type=date], select, textarea {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 300;
      padding: 0.75rem 1rem;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--gold-dim); }
    textarea { resize: vertical; min-height: 120px; line-height: 1.7; }

    .hint {
      margin-top: 0.4rem;
      font-family: 'Inconsolata', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      line-height: 1.9;
    }

    /* Photo upload button */
    .photo-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg-card);
      border: 1px dashed var(--border-light);
      color: var(--text-muted);
      font-family: 'Inconsolata', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 1rem;
      border-radius: 2px;
      cursor: pointer;
      width: 100%;
      transition: border-color 0.2s, color 0.2s;
    }

    .photo-btn:hover { border-color: var(--gold-dim); color: var(--gold); }

    .photo-preview {
      margin-top: 0.75rem;
      display: none;
    }

    .photo-preview img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 2px;
      display: block;
    }

    .photo-preview .remove-photo {
      margin-top: 0.5rem;
      font-family: 'Inconsolata', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    .photo-preview .remove-photo:hover { color: var(--gold); }

    /* Buttons */
    .btn {
      background: transparent;
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      font-family: 'Inconsolata', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.75rem 2rem;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s;
    }

    .btn:hover { background: var(--gold-dim); color: var(--bg); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .hidden { display: none !important; }

    .success {
      padding: 1rem;
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      font-family: 'Inconsolata', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      border-radius: 2px;
      margin-bottom: 2rem;
      display: none;
    }

    .error-msg {
      padding: 1rem;
      border: 1px solid #c87070;
      color: #c87070;
      font-family: 'Inconsolata', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      border-radius: 2px;
      margin-bottom: 2rem;
      display: none;
    }

    @media (max-width: 600px) {
      header { padding: 1.25rem 1.5rem; }
      main { padding-left: 1.5rem; padding-right: 1.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="site-title">Noctiluca</div>
    <nav><a href="/">← Collection</a></nav>
  </header>

  <main>

    <!-- Password screen -->
    <div id="auth-screen">
      <p class="form-title">Enter passphrase</p>
      <div class="group">
        <input type="password" id="pw-input" placeholder="passphrase" autocomplete="current-password" />
        <p class="hint hidden" id="pw-error" style="color:#c87070;">Incorrect passphrase.</p>
      </div>
      <button class="btn" onclick="checkAuth()">Enter</button>
    </div>

    <!-- Post form -->
    <div id="form-screen" class="hidden">
      <p class="form-title">New Entry</p>

      <div class="success" id="success-msg">✓ Published — your post is live.</div>
      <div class="error-msg" id="error-msg"></div>

      <!-- Type -->
      <div class="group">
        <label>Type</label>
        <select id="type" onchange="updateFields()">
          <option value="thought">Thought</option>
          <option value="quote">Quote</option>
          <option value="image">Image</option>
          <option value="video">Video</option>
        </select>
      </div>

      <!-- Content -->
      <div class="group">
        <label id="content-label">Thought</label>

        <!-- Textarea for thought/quote -->
        <textarea id="content-text" placeholder="A thought, fragment, observation..."></textarea>

        <!-- Photo upload for image -->
        <div id="photo-upload" class="hidden">
          <input type="file" id="photo-file" accept="image/*" class="hidden" onchange="handlePhoto(event)" />
          <button type="button" class="photo-btn" onclick="document.getElementById('photo-file').click()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            Choose from Photos
          </button>
          <div class="photo-preview" id="photo-preview">
            <img id="photo-preview-img" src="" alt="preview" />
            <button class="remove-photo" onclick="removePhoto()">✕ Remove</button>
          </div>
          <p class="hint" style="margin-top:0.5rem;">Tap to choose a photo from your library</p>
        </div>

        <!-- URL input for video -->
        <input type="text" id="content-url" class="hidden" placeholder="https://www.youtube.com/embed/..." />
        <p class="hint hidden" id="video-hint">Use the embed URL format: youtube.com/embed/VIDEO_ID</p>
      </div>

      <!-- Attribution (quotes only) -->
      <div class="group hidden" id="attribution-group">
        <label>Attribution</label>
        <input type="text" id="attribution" placeholder="Alan Watts, Gary Snyder..." />
      </div>

      <!-- Caption (images and videos) -->
      <div class="group hidden" id="caption-group">
        <label>Caption (optional)</label>
        <input type="text" id="caption" placeholder="A brief note..." />
      </div>

      <!-- Date -->
      <div class="group">
        <label>Date</label>
        <input type="date" id="date" />
      </div>

      <button class="btn" id="submit-btn" onclick="submitPost()">Publish</button>
    </div>

  </main>

  <script>
    // Set today's date
    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    // Restore auth
    if (sessionStorage.getItem('nc_auth') === '1') showForm();

    document.getElementById('pw-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkAuth();
    });

    function checkAuth() {
      // Password is checked server-side — just pass it through
      const val = document.getElementById('pw-input').value;
      if (!val) return;
      sessionStorage.setItem('nc_pw', val);
      sessionStorage.setItem('nc_auth', '1');
      showForm();
    }

    function showForm() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('form-screen').classList.remove('hidden');
    }

    function updateFields() {
      const type = document.getElementById('type').value;
      const label = document.getElementById('content-label');
      const textarea = document.getElementById('content-text');
      const photoUpload = document.getElementById('photo-upload');
      const urlInput = document.getElementById('content-url');
      const videoHint = document.getElementById('video-hint');
      const attrGroup = document.getElementById('attribution-group');
      const capGroup = document.getElementById('caption-group');

      // Hide all
      textarea.classList.add('hidden');
      photoUpload.classList.add('hidden');
      urlInput.classList.add('hidden');
      videoHint.classList.add('hidden');
      attrGroup.classList.add('hidden');
      capGroup.classList.add('hidden');

      if (type === 'thought') {
        label.textContent = 'Thought';
        textarea.placeholder = 'A thought, fragment, observation...';
        textarea.classList.remove('hidden');
      } else if (type === 'quote') {
        label.textContent = 'Quote';
        textarea.placeholder = 'The quote text...';
        textarea.classList.remove('hidden');
        attrGroup.classList.remove('hidden');
      } else if (type === 'image') {
        label.textContent = 'Photo';
        photoUpload.classList.remove('hidden');
        capGroup.classList.remove('hidden');
      } else if (type === 'video') {
        label.textContent = 'YouTube embed URL';
        urlInput.classList.remove('hidden');
        videoHint.classList.remove('hidden');
        capGroup.classList.remove('hidden');
      }
    }

    let photoBase64 = null;

    function handlePhoto(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        photoBase64 = e.target.result; // full data URL
        document.getElementById('photo-preview-img').src = photoBase64;
        document.getElementById('photo-preview').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function removePhoto() {
      photoBase64 = null;
      document.getElementById('photo-file').value = '';
      document.getElementById('photo-preview').style.display = 'none';
      document.getElementById('photo-preview-img').src = '';
    }

    function showSuccess() {
      document.getElementById('success-msg').style.display = 'block';
      document.getElementById('error-msg').style.display = 'none';
      // Reset form
      document.getElementById('content-text').value = '';
      document.getElementById('content-url').value = '';
      document.getElementById('attribution').value = '';
      document.getElementById('caption').value = '';
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
      document.getElementById('type').value = 'thought';
      updateFields();
      removePhoto();
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('success-msg').style.display = 'none';
    }

    async function submitPost() {
      const type = document.getElementById('type').value;
      const btn = document.getElementById('submit-btn');
      const password = sessionStorage.getItem('nc_pw');

      let content = '';
      let imageData = null;

      if (type === 'thought' || type === 'quote') {
        content = document.getElementById('content-text').value.trim();
        if (!content) { showError('Please enter content.'); return; }
      } else if (type === 'image') {
        if (!photoBase64) { showError('Please choose a photo.'); return; }
        imageData = photoBase64;
        content = ''; // will be set by server after Cloudinary upload
      } else if (type === 'video') {
        content = document.getElementById('content-url').value.trim();
        if (!content) { showError('Please enter a video URL.'); return; }
      }

      btn.disabled = true;
      btn.textContent = type === 'image' ? 'Uploading...' : 'Publishing...';

      const payload = {
        password,
        type,
        content,
        date: document.getElementById('date').value,
        attribution: document.getElementById('attribution').value.trim(),
        caption: document.getElementById('caption').value.trim(),
      };

      if (imageData) {
        payload.imageData = imageData;
        payload.imageType = 'image';
      }

      try {
        const res = await fetch('/api/post', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();

        if (res.ok && data.success) {
          showSuccess();
        } else if (res.status === 401) {
          sessionStorage.removeItem('nc_auth');
          sessionStorage.removeItem('nc_pw');
          document.getElementById('auth-screen').classList.remove('hidden');
          document.getElementById('form-screen').classList.add('hidden');
          document.getElementById('pw-error').classList.remove('hidden');
        } else {
          showError('Something went wrong. Please try again.');
        }
      } catch(e) {
        showError('Could not connect. Check your internet and try again.');
      }

      btn.disabled = false;
      btn.textContent = 'Publish';
    }
  </script>

</body>
</html>
