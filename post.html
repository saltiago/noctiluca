<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage — Noctiluca</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #111009; --card: #1a1814; --text: #e8e0cc;
      --muted: #8a8070; --gold: #c8a96e; --gold2: #7a6540;
      --border: #2a2620; --bl: #3a3428; --red: #c87070;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--text);
      font-family:'Cormorant Garamond',Georgia,serif;
      font-weight:300; line-height:1.7; min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    a { color:inherit; text-decoration:none; }

    header {
      position:fixed; top:0; left:0; right:0; z-index:100;
      padding:1.5rem 2.5rem;
      display:flex; align-items:center; justify-content:space-between;
      background:linear-gradient(to bottom,var(--bg) 60%,transparent);
    }
    .logo {
      font-family:'Cormorant Garamond',serif; font-size:1.05rem;
      font-weight:400; letter-spacing:.25em; text-transform:uppercase; color:var(--gold);
    }
    nav a {
      font-family:'Inconsolata',monospace; font-size:.7rem;
      letter-spacing:.15em; text-transform:uppercase; color:var(--muted);
    }
    nav a:hover { color:var(--gold); }

    main { max-width:640px; margin:0 auto; padding:7rem 2rem 4rem; }

    .sec-title {
      font-family:'Inconsolata',monospace; font-size:1rem;
      letter-spacing:.2em; text-transform:uppercase; color:var(--gold);
      margin-bottom:2rem; font-weight:400;
    }

    .group { margin-bottom:1.5rem; }
    label {
      display:block; font-family:'Inconsolata',monospace; font-size:.65rem;
      letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:.5rem;
    }
    input[type=text], input[type=password], input[type=date], select, textarea {
      width:100%; background:var(--card); border:1px solid var(--bl);
      color:var(--text); font-family:'Cormorant Garamond',serif;
      font-size:1rem; font-weight:300; padding:.75rem 1rem;
      border-radius:2px; outline:none; -webkit-appearance:none; transition:border-color .2s;
    }
    input:focus, select:focus, textarea:focus { border-color:var(--gold2); }
    textarea { resize:vertical; min-height:120px; line-height:1.7; }

    .hint {
      margin-top:.4rem; font-family:'Inconsolata',monospace;
      font-size:.62rem; letter-spacing:.08em; color:var(--muted); line-height:1.9;
    }

    .photo-btn {
      display:flex; align-items:center; gap:.75rem;
      background:var(--card); border:1px dashed var(--bl); color:var(--muted);
      font-family:'Inconsolata',monospace; font-size:.7rem;
      letter-spacing:.12em; text-transform:uppercase;
      padding:1rem; border-radius:2px; cursor:pointer; width:100%; transition:all .2s;
    }
    .photo-btn:hover { border-color:var(--gold2); color:var(--gold); }
    .photo-preview { margin-top:.75rem; display:none; }
    .photo-preview img { width:100%; max-height:300px; object-fit:cover; border-radius:2px; display:block; }
    .rm-photo {
      margin-top:.5rem; font-family:'Inconsolata',monospace; font-size:.62rem;
      letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
      cursor:pointer; background:none; border:none; padding:0;
    }
    .rm-photo:hover { color:var(--gold); }

    .btn {
      background:transparent; border:1px solid var(--gold2); color:var(--gold);
      font-family:'Inconsolata',monospace; font-size:.7rem;
      letter-spacing:.2em; text-transform:uppercase;
      padding:.75rem 2rem; cursor:pointer; border-radius:2px; transition:all .2s;
    }
    .btn:hover { background:var(--gold2); color:var(--bg); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }

    .notice {
      padding:1rem; font-family:'Inconsolata',monospace; font-size:.72rem;
      letter-spacing:.08em; border-radius:2px; margin-bottom:2rem; display:none;
    }
    .notice.ok  { border:1px solid var(--gold2); color:var(--gold); }
    .notice.err { border:1px solid var(--red);   color:var(--red); }

    .divider { border-top:1px solid var(--border); margin:3rem 0; }

    /* Post list */
    .post-list { display:flex; flex-direction:column; }
    .post-item {
      padding:1.25rem 0; border-bottom:1px solid var(--border);
      display:flex; align-items:flex-start; justify-content:space-between; gap:1rem;
    }
    .post-item:first-child { border-top:1px solid var(--border); }
    .pi-info { flex:1; min-width:0; }
    .pi-type {
      font-family:'Inconsolata',monospace; font-size:.6rem;
      letter-spacing:.15em; text-transform:uppercase; color:var(--gold2); margin-bottom:.25rem;
    }
    .pi-preview {
      font-size:1rem; font-weight:300; color:var(--text);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .pi-date {
      font-family:'Inconsolata',monospace; font-size:.6rem;
      letter-spacing:.08em; color:var(--muted); margin-top:.25rem;
    }
    .pi-actions { display:flex; gap:.5rem; flex-shrink:0; align-items:center; }
    .pi-edit {
      background:transparent; border:1px solid var(--bl); color:var(--muted);
      font-family:'Inconsolata',monospace; font-size:.62rem;
      letter-spacing:.12em; text-transform:uppercase;
      padding:.4rem .85rem; cursor:pointer; border-radius:2px; transition:all .2s;
    }
    .pi-edit:hover { border-color:var(--gold2); color:var(--gold); }
    .pi-del {
      background:transparent; border:1px solid var(--red); color:var(--red);
      font-family:'Inconsolata',monospace; font-size:.62rem;
      letter-spacing:.12em; text-transform:uppercase;
      padding:.4rem .85rem; cursor:pointer; border-radius:2px; transition:all .2s;
    }
    .pi-del:hover { background:var(--red); color:var(--bg); }

    /* Confirm delete inline */
    .pi-confirm {
      display:none; width:100%; padding:.5rem 0;
      font-family:'Inconsolata',monospace; font-size:.62rem;
      letter-spacing:.08em; color:var(--red);
      align-items:center; gap:.75rem;
    }
    .pi-confirm.on { display:flex; }
    .pi-confirm button {
      background:none; border:none; cursor:pointer; padding:0;
      font-family:'Inconsolata',monospace; font-size:.62rem;
      letter-spacing:.08em; text-transform:uppercase;
    }
    .pi-confirm .cy { color:var(--red); text-decoration:underline; }
    .pi-confirm .cn { color:var(--muted); }

    .hidden { display:none !important; }

    /* ── EDIT OVERLAY — full screen bottom sheet ── */
    #edit-overlay {
      display:none; position:fixed; inset:0; z-index:900;
      background:rgba(0,0,0,.65);
      align-items:flex-end; justify-content:center;
    }
    #edit-overlay.open { display:flex; }
    #edit-sheet {
      background:#1c1a14;
      border-top:1px solid var(--border);
      border-radius:14px 14px 0 0;
      padding:1.75rem 1.5rem 2.5rem;
      width:100%; max-width:680px;
      max-height:88vh; overflow-y:auto;
      box-shadow:0 -8px 40px rgba(0,0,0,.8);
      animation:sheetUp .25s ease;
    }
    @keyframes sheetUp {
      from { transform:translateY(80px); opacity:0; }
      to   { transform:translateY(0);    opacity:1; }
    }
    #edit-sheet .sec-title { margin-bottom:1.25rem; font-size:.85rem; }
    #edit-sheet .group { margin-bottom:1rem; }
    #edit-sheet input[type=text],
    #edit-sheet input[type=date],
    #edit-sheet select,
    #edit-sheet textarea {
      width:100%; background:var(--bg); border:1px solid var(--border);
      color:var(--text); font-family:'Cormorant Garamond',serif;
      font-size:1rem; font-weight:300; padding:.65rem .9rem;
      border-radius:2px; outline:none; -webkit-appearance:none;
    }
    #edit-sheet textarea { resize:vertical; min-height:100px; line-height:1.7; }
    .ef-row { display:flex; gap:.75rem; margin-top:1rem; }
    .ef-save {
      background:transparent; border:1px solid var(--gold2); color:var(--gold);
      font-family:'Inconsolata',monospace; font-size:.65rem;
      letter-spacing:.15em; text-transform:uppercase;
      padding:.6rem 1.25rem; cursor:pointer; border-radius:2px; transition:all .2s;
    }
    .ef-save:hover { background:var(--gold2); color:var(--bg); }
    .ef-cancel {
      background:transparent; border:1px solid var(--border); color:var(--muted);
      font-family:'Inconsolata',monospace; font-size:.65rem;
      letter-spacing:.15em; text-transform:uppercase;
      padding:.6rem .9rem; cursor:pointer; border-radius:2px;
    }
    .ef-msg {
      margin-top:.75rem; font-family:'Inconsolata',monospace;
      font-size:.65rem; letter-spacing:.08em; display:none;
    }
    .ef-msg.ok  { color:var(--gold); display:block; }
    .ef-msg.err { color:var(--red);  display:block; }

    @media (max-width:600px) {
      header { padding:1.25rem 1.5rem; }
      main { padding-left:1.5rem; padding-right:1.5rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Noctiluca</div>
  <nav><a href="/">← Collection</a></nav>
</header>

<!-- Edit overlay -->
<div id="edit-overlay">
  <div id="edit-sheet">
    <div id="edit-body"></div>
  </div>
</div>

<main>

  <!-- Auth -->
  <div id="auth-screen">
    <p class="sec-title">Enter passphrase</p>
    <div class="group">
      <input type="password" id="pw-input" placeholder="passphrase" autocomplete="current-password" />
      <p class="hint hidden" id="pw-err" style="color:#c87070">Incorrect passphrase.</p>
    </div>
    <button class="btn" onclick="checkAuth()">Enter</button>
  </div>

  <!-- Admin -->
  <div id="admin-screen" class="hidden">

    <!-- New post -->
    <p class="sec-title">New Entry</p>
    <div class="notice ok"  id="create-ok">✓ Published — your post is live.</div>
    <div class="notice err" id="create-err"></div>

    <div class="group">
      <label>Type</label>
      <select id="type" onchange="updateFields()">
        <option value="thought">Thought</option>
        <option value="quote">Quote</option>
        <option value="image">Image</option>
        <option value="video">Video</option>
      </select>
    </div>

    <div class="group">
      <label id="content-label">Thought</label>
      <textarea id="content-text" placeholder="A thought, fragment, observation..."></textarea>

      <div id="photo-upload" class="hidden">
        <input type="file" id="photo-file" accept="image/*" class="hidden" onchange="handlePhoto(event)" />
        <button type="button" class="photo-btn" onclick="document.getElementById('photo-file').click()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          Choose from Photos
        </button>
        <div class="photo-preview" id="photo-preview">
          <img id="photo-preview-img" src="" alt="preview" />
          <button class="rm-photo" onclick="removePhoto()">✕ Remove</button>
        </div>
      </div>

      <input type="text" id="content-url" class="hidden" placeholder="https://www.youtube.com/embed/..." />
      <p class="hint hidden" id="video-hint">Use the embed URL format: youtube.com/embed/VIDEO_ID</p>
    </div>

    <div class="group hidden" id="attr-group">
      <label>Attribution</label>
      <input type="text" id="attribution" placeholder="Alan Watts, Gary Snyder..." />
    </div>

    <div class="group hidden" id="cap-group">
      <label>Caption (optional)</label>
      <input type="text" id="caption" placeholder="A brief note..." />
    </div>

    <div class="group">
      <label>Date</label>
      <input type="date" id="date" />
    </div>

    <button class="btn" id="submit-btn" onclick="submitPost()">Publish</button>

    <!-- All posts -->
    <div class="divider"></div>
    <p class="sec-title">All Posts</p>
    <div class="notice ok"  id="list-ok">✓ Done.</div>
    <div class="notice err" id="list-err"></div>
    <div class="post-list" id="post-list"></div>

  </div>
</main>

<script>
var allPosts = [];
var editIdx = null;
var photoBase64 = null;

document.getElementById('date').value = new Date().toISOString().split('T')[0];

if (sessionStorage.getItem('nc_auth') === '1') showAdmin();

document.getElementById('pw-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkAuth();
});

function pw() { return sessionStorage.getItem('nc_pw'); }

function checkAuth() {
  var val = document.getElementById('pw-input').value;
  if (!val) return;
  sessionStorage.setItem('nc_pw', val);
  sessionStorage.setItem('nc_auth', '1');
  showAdmin();
}

async function showAdmin() {
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('admin-screen').classList.remove('hidden');
  await loadList();
}

async function loadList() {
  var list = document.getElementById('post-list');
  list.innerHTML = '<p style="font-family:\'Inconsolata\',monospace;font-size:.7rem;color:var(--muted);letter-spacing:.1em;padding:.5rem 0">Loading...</p>';
  try {
    var r = await fetch('/posts.json?t='+Date.now());
    allPosts = await r.json();
    allPosts.sort(function(a,b){return new Date(b.date)-new Date(a.date);});
    renderList();
  } catch(e) {
    list.innerHTML = '<p style="color:var(--red);font-family:\'Inconsolata\',monospace;font-size:.7rem;">Could not load posts.</p>';
  }
}

function renderList() {
  var list = document.getElementById('post-list');
  if (!allPosts.length) {
    list.innerHTML = '<p style="font-family:\'Inconsolata\',monospace;font-size:.7rem;color:var(--muted);padding:1rem 0;">No posts yet.</p>';
    return;
  }
  list.innerHTML = allPosts.map(function(p, i) {
    var preview = p.type==='image' ? '[image]' : (p.content||'').substring(0,60)+((p.content||'').length>60?'...':'');
    var date = p.date ? new Date(p.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
    return '<div class="post-item" id="pi-'+p.id+'">' +
      '<div class="pi-info">' +
        '<div class="pi-type">'+p.type+'</div>' +
        '<div class="pi-preview">'+preview+'</div>' +
        '<div class="pi-date">'+date+'</div>' +
        '<div class="pi-confirm" id="pconf-'+p.id+'">Delete? ' +
          '<button class="cy" onclick="doDelete(\''+p.id+'\')">Yes, delete</button> ' +
          '<button class="cn" onclick="noConf(\''+p.id+'\')">Cancel</button>' +
        '</div>' +
      '</div>' +
      '<div class="pi-actions">' +
        '<button class="pi-edit" onclick="openEdit('+i+')">Edit</button>' +
        '<button class="pi-del" onclick="askDel(\''+p.id+'\')">Delete</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function askDel(id) {
  document.querySelectorAll('.pi-confirm').forEach(function(el){el.classList.remove('on');});
  document.getElementById('pconf-'+id).classList.add('on');
}
function noConf(id) {
  document.getElementById('pconf-'+id).classList.remove('on');
}
async function doDelete(id) {
  var r = await fetch('/api/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',id:id,password:pw()})});
  if (r.ok) {
    document.getElementById('pi-'+id).remove();
    allPosts = allPosts.filter(function(p){return p.id!==id;});
    showNotice('list-ok','✓ Deleted.');
  } else {
    showNotice('list-err','Could not delete. Try again.');
  }
}

/* ── Edit overlay ── */
function openEdit(i) {
  editIdx = i;
  var p = allPosts[i];
  var isText = p.type==='thought'||p.type==='quote';
  document.getElementById('edit-body').innerHTML =
    '<p class="sec-title">Edit Entry</p>'+
    '<div class="group"><label>Type</label>'+
    '<select id="ef-type" onchange="efFields()">'+
      '<option value="thought"'+(p.type==='thought'?' selected':'')+'>Thought</option>'+
      '<option value="quote"'+(p.type==='quote'?' selected':'')+'>Quote</option>'+
      '<option value="image"'+(p.type==='image'?' selected':'')+'>Image</option>'+
      '<option value="video"'+(p.type==='video'?' selected':'')+'>Video</option>'+
    '</select></div>'+
    '<div class="group"><label id="ef-cl">Content</label>'+
    '<textarea id="ef-text"'+(isText?'':' style="display:none"')+'>'+( isText?p.content:'' )+'</textarea>'+
    '<input type="text" id="ef-url" value="'+(isText?'':p.content)+'"'+(isText?' style="display:none"':'')+' placeholder="URL..." /></div>'+
    '<div class="group" id="ef-ag"'+(p.type==='quote'?'':' style="display:none"')+'><label>Attribution</label>'+
    '<input type="text" id="ef-attr" value="'+(p.attribution||'')+'" placeholder="Alan Watts..." /></div>'+
    '<div class="group" id="ef-cg"'+((p.type==='image'||p.type==='video')?'':' style="display:none"')+'><label>Caption</label>'+
    '<input type="text" id="ef-cap" value="'+(p.caption||'')+'" placeholder="Optional..." /></div>'+
    '<div class="group"><label>Date</label><input type="date" id="ef-date" value="'+(p.date||'')+'" /></div>'+
    '<div class="ef-row"><button class="ef-save" onclick="saveEdit()">Save</button><button class="ef-cancel" onclick="closeEdit()">Cancel</button></div>'+
    '<div class="ef-msg" id="ef-msg"></div>';
  document.getElementById('edit-overlay').classList.add('open');
}

function efFields() {
  var t = document.getElementById('ef-type').value;
  document.getElementById('ef-text').style.display = (t==='thought'||t==='quote')?'':'none';
  document.getElementById('ef-url').style.display  = (t==='image'||t==='video')?'':'none';
  document.getElementById('ef-ag').style.display   = t==='quote'?'':'none';
  document.getElementById('ef-cg').style.display   = (t==='image'||t==='video')?'':'none';
  document.getElementById('ef-cl').textContent = {thought:'Thought',quote:'Quote text',image:'Image URL',video:'YouTube embed URL'}[t];
}

function closeEdit() {
  document.getElementById('edit-overlay').classList.remove('open');
  editIdx = null;
}

document.getElementById('edit-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeEdit();
});

async function saveEdit() {
  if (editIdx === null) return;
  var p = allPosts[editIdx];
  var t = document.getElementById('ef-type').value;
  var isText = t==='thought'||t==='quote';
  var content = isText ? document.getElementById('ef-text').value.trim() : document.getElementById('ef-url').value.trim();
  var msg = document.getElementById('ef-msg');
  msg.className = 'ef-msg';

  var r = await fetch('/api/post',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      action:'edit', id:p.id, type:t, content:content,
      date: document.getElementById('ef-date').value,
      attribution: (document.getElementById('ef-attr')||{value:''}).value.trim(),
      caption:     (document.getElementById('ef-cap') ||{value:''}).value.trim(),
      password: pw()
    })
  });

  if (r.ok) {
    msg.textContent='✓ Saved — reloading...';
    msg.className='ef-msg ok';
    setTimeout(function(){ closeEdit(); loadList(); }, 1500);
  } else if (r.status===401) {
    msg.textContent='Session expired — re-enter passphrase.';
    msg.className='ef-msg err';
  } else {
    msg.textContent='Could not save. Try again.';
    msg.className='ef-msg err';
  }
}

/* ── New post ── */
function updateFields() {
  var type = document.getElementById('type').value;
  var label = document.getElementById('content-label');
  var ta = document.getElementById('content-text');
  var pu = document.getElementById('photo-upload');
  var ui = document.getElementById('content-url');
  var vh = document.getElementById('video-hint');
  var ag = document.getElementById('attr-group');
  var cg = document.getElementById('cap-group');

  ta.classList.add('hidden'); pu.classList.add('hidden');
  ui.classList.add('hidden'); vh.classList.add('hidden');
  ag.classList.add('hidden'); cg.classList.add('hidden');

  if (type==='thought') { label.textContent='Thought'; ta.placeholder='A thought, fragment, observation...'; ta.classList.remove('hidden'); }
  else if (type==='quote') { label.textContent='Quote'; ta.placeholder='The quote text...'; ta.classList.remove('hidden'); ag.classList.remove('hidden'); }
  else if (type==='image') { label.textContent='Photo'; pu.classList.remove('hidden'); cg.classList.remove('hidden'); }
  else if (type==='video') { label.textContent='YouTube embed URL'; ui.classList.remove('hidden'); vh.classList.remove('hidden'); cg.classList.remove('hidden'); }
}

function handlePhoto(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var MAX=1600, w=img.width, h=img.height;
      if (w>MAX||h>MAX) { if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;} }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      photoBase64 = c.toDataURL('image/jpeg',0.82);
      document.getElementById('photo-preview-img').src = photoBase64;
      document.getElementById('photo-preview').style.display = 'block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removePhoto() {
  photoBase64 = null;
  document.getElementById('photo-file').value='';
  document.getElementById('photo-preview').style.display='none';
}

async function uploadToCloudinary(base64) {
  var r = await fetch('/api/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'cloudinary_config',password:pw()})});
  var cfg = await r.json();
  var fd = new FormData();
  fd.append('file', base64);
  fd.append('upload_preset', cfg.uploadPreset);
  var cr = await fetch('https://api.cloudinary.com/v1_1/'+cfg.cloudName+'/image/upload',{method:'POST',body:fd});
  var cd = await cr.json();
  if (!cd.secure_url) throw new Error('Upload failed');
  return cd.secure_url;
}

function showNotice(id, msg) {
  var el = document.getElementById(id);
  if (msg) el.textContent = msg;
  el.style.display = 'block';
  setTimeout(function(){ el.style.display='none'; }, 4000);
}

async function submitPost() {
  var type = document.getElementById('type').value;
  var btn = document.getElementById('submit-btn');
  var content = '';

  if (type==='thought'||type==='quote') {
    content = document.getElementById('content-text').value.trim();
    if (!content) { showNotice('create-err','Please enter content.'); return; }
  } else if (type==='image') {
    if (!photoBase64) { showNotice('create-err','Please choose a photo.'); return; }
  } else if (type==='video') {
    content = document.getElementById('content-url').value.trim();
    if (!content) { showNotice('create-err','Please enter a video URL.'); return; }
  }

  btn.disabled=true; btn.textContent=type==='image'?'Uploading...':'Publishing...';

  try {
    if (type==='image') { content = await uploadToCloudinary(photoBase64); btn.textContent='Saving...'; }
    var r = await fetch('/api/post',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        action:'create', type, content, password:pw(),
        date: document.getElementById('date').value,
        attribution: document.getElementById('attribution').value.trim(),
        caption: document.getElementById('caption').value.trim()
      })
    });
    if (r.ok) {
      showNotice('create-ok','✓ Published — your post is live.');
      document.getElementById('content-text').value='';
      document.getElementById('content-url').value='';
      document.getElementById('attribution').value='';
      document.getElementById('caption').value='';
      document.getElementById('date').value=new Date().toISOString().split('T')[0];
      document.getElementById('type').value='thought';
      updateFields(); removePhoto();
      setTimeout(loadList, 3000);
    } else { showNotice('create-err','Something went wrong. Try again.'); }
  } catch(e) { showNotice('create-err','Upload failed. Check connection and try again.'); }

  btn.disabled=false; btn.textContent='Publish';
}
</script>
</body>
</html>
