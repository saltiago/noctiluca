<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noctiluca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #111009;
      --bg-card: #1c1a14;
      --text: #ede5d0;
      --text-muted: #9a9080;
      --gold: #c8a96e;
      --gold-dim: #7a6540;
      --border: #2a2620;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Header ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      padding: 1.4rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, var(--bg) 55%, transparent);
    }

    .site-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
    }

    nav a {
      font-family: 'Inconsolata', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color 0.2s;
    }
    nav a:hover { color: var(--gold); }

    /* ── Masonry Grid ── */
    main {
      padding: 5.5rem 1.25rem 4rem;
      columns: 3 280px;
      column-gap: 0.75rem;
    }

    .card {
      break-inside: avoid;
      margin-bottom: 0.75rem;
      background: var(--bg-card);
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }
    .card:hover { opacity: 0.85; transform: translateY(-2px); }

    .card-image img { width: 100%; display: block; }
    .card-image .caption {
      padding: 0.6rem 0.85rem 0.75rem;
      font-family: 'Inconsolata', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .card-quote {
      padding: 1.5rem 1.25rem 1.4rem;
      border-left: 2px solid var(--gold-dim);
    }
    .card-quote blockquote {
      font-size: 1.1rem;
      font-style: italic;
      font-weight: 300;
      line-height: 1.55;
      color: var(--text);
    }
    .card-quote cite {
      display: block;
      margin-top: 0.75rem;
      font-family: 'Inconsolata', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-style: normal;
    }

    .card-thought { padding: 1.4rem 1.25rem; }
    .card-thought p {
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.75;
      color: var(--text);
    }

    .card-video .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #1a1814;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(200,169,110,0.12);
      border: 1px solid var(--gold-dim);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-video .caption {
      padding: 0.6rem 0.85rem 0.75rem;
      font-family: 'Inconsolata', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .empty {
      column-span: all;
      text-align: center;
      padding: 6rem 2rem;
      font-family: 'Inconsolata', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(10,9,7,0.96);
      flex-direction: column;
    }
    .lightbox.open { display: flex; }

    .lb-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(10,9,7,0.95) 60%, transparent);
    }

    .lb-counter {
      font-family: 'Inconsolata', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    .lb-nav { display: flex; align-items: center; gap: 1rem; }

    .lb-arrow {
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer; padding: 0.25rem;
      transition: color 0.2s;
      font-size: 1.1rem; line-height: 1;
    }
    .lb-arrow:hover { color: var(--gold); }
    .lb-arrow:disabled { opacity: 0.2; cursor: default; }

    .lb-close {
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer; font-size: 1.4rem;
      line-height: 1; transition: color 0.2s; padding: 0.25rem;
    }
    .lb-close:hover { color: var(--gold); }

    .lb-feed {
      flex: 1;
      overflow-y: auto;
      padding: 5rem 2rem 4rem;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .lb-item {
      max-width: 680px;
      margin: 0 auto;
      padding: 2.5rem 0;
      border-bottom: 1px solid var(--border);
    }
    .lb-item:first-child { border-top: 1px solid var(--border); }

    .lb-meta {
      display: flex; align-items: center;
      gap: 0.75rem; margin-bottom: 1.25rem;
    }
    .lb-tag {
      font-family: 'Inconsolata', monospace;
      font-size: 0.65rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--gold-dim);
      border: 1px solid var(--gold-dim);
      padding: 0.15rem 0.5rem; border-radius: 2px;
    }
    .lb-date {
      font-family: 'Inconsolata', monospace;
      font-size: 0.65rem; letter-spacing: 0.1em; color: var(--text-muted);
    }

    .lb-item img { width: 100%; height: auto; display: block; border-radius: 2px; }

    .lb-item blockquote {
      font-size: 1.9rem; font-style: italic; font-weight: 300;
      line-height: 1.45; color: var(--text);
      padding-left: 1.5rem; border-left: 1px solid var(--gold-dim);
    }
    .lb-item cite {
      display: block; margin-top: 1rem; padding-left: 1.5rem;
      font-family: 'Inconsolata', monospace; font-size: 0.7rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-muted); font-style: normal;
    }
    .lb-item .lb-thought {
      font-size: 1.3rem; font-weight: 300; line-height: 1.8; color: var(--text);
    }
    .lb-item .lb-caption {
      margin-top: 0.85rem; font-family: 'Inconsolata', monospace;
      font-size: 0.7rem; letter-spacing: 0.08em; color: var(--text-muted);
    }
    .lb-video-wrapper {
      position: relative; padding-bottom: 56.25%;
      height: 0; overflow: hidden; border-radius: 2px;
    }
    .lb-video-wrapper iframe {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; border: none;
    }

    /* Admin actions */
    .lb-actions {
      display: flex; gap: 0.75rem; margin-top: 1.5rem;
      padding-top: 1.25rem; border-top: 1px solid var(--border);
      align-items: center; flex-wrap: wrap;
    }
    .lb-actions.hidden { display: none; }

    .btn-edit {
      background: transparent; border: 1px solid var(--gold-dim); color: var(--gold);
      font-family: 'Inconsolata', monospace; font-size: 0.62rem;
      letter-spacing: 0.15em; text-transform: uppercase;
      padding: 0.45rem 1rem; cursor: pointer; border-radius: 2px; transition: all 0.2s;
    }
    .btn-edit:hover { background: var(--gold-dim); color: var(--bg); }

    .btn-delete {
      background: transparent; border: 1px solid #7a3030; color: #c87070;
      font-family: 'Inconsolata', monospace; font-size: 0.62rem;
      letter-spacing: 0.15em; text-transform: uppercase;
      padding: 0.45rem 1rem; cursor: pointer; border-radius: 2px; transition: all 0.2s;
    }
    .btn-delete:hover { background: #7a3030; color: var(--bg); }

    .lb-confirm {
      font-family: 'Inconsolata', monospace; font-size: 0.62rem;
      letter-spacing: 0.08em; color: #c87070;
      display: none; align-items: center; gap: 0.75rem; width: 100%; margin-top: 0.25rem;
    }
    .lb-confirm.visible { display: flex; }
    .lb-confirm button {
      background: none; border: none;
      font-family: 'Inconsolata', monospace; font-size: 0.62rem;
      letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; padding: 0;
    }
    .lb-confirm .yes { color: #c87070; text-decoration: underline; }
    .lb-confirm .no  { color: var(--text-muted); }

    /* ── Edit overlay — true full-screen bottom sheet ── */
    .edit-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 700;
      background: rgba(10,9,7,0.65);
      align-items: flex-end;
      justify-content: center;
    }
    .edit-overlay.open { display: flex; }

    .edit-sheet {
      background: #1c1a14;
      border-top: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      padding: 1.75rem 1.5rem 2.5rem;
      width: 100%;
      max-width: 680px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 -4px 40px rgba(0,0,0,0.7);
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .ef-group { margin-bottom: 1rem; }
    .ef-label {
      display: block; font-family: 'Inconsolata', monospace;
      font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 0.4rem;
    }
    .ef-input, .ef-select, .ef-textarea {
      width: 100%; background: var(--bg);
      border: 1px solid var(--border); color: var(--text);
      font-family: 'Cormorant Garamond', serif; font-size: 1rem;
      font-weight: 300; padding: 0.6rem 0.85rem;
      border-radius: 2px; outline: none; -webkit-appearance: none;
    }
    .ef-textarea { resize: vertical; min-height: 90px; line-height: 1.7; }
    .ef-row { display: flex; gap: 0.75rem; margin-top: 1rem; }
    .ef-save {
      background: transparent; border: 1px solid var(--gold-dim); color: var(--gold);
      font-family: 'Inconsolata', monospace; font-size: 0.62rem;
      letter-spacing: 0.15em; text-transform: uppercase;
      padding: 0.6rem 1.25rem; cursor: pointer; border-radius: 2px; transition: all 0.2s;
    }
    .ef-save:hover { background: var(--gold-dim); color: var(--bg); }
    .ef-cancel {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
      font-family: 'Inconsolata', monospace; font-size: 0.62rem;
      letter-spacing: 0.15em; text-transform: uppercase;
      padding: 0.6rem 0.85rem; cursor: pointer; border-radius: 2px;
    }
    .ef-notice {
      margin-top: 0.75rem; font-family: 'Inconsolata', monospace;
      font-size: 0.65rem; letter-spacing: 0.08em; display: none;
    }
    .ef-notice.success { color: var(--gold); }
    .ef-notice.error   { color: #c87070; }

    .lb-edit-form { display: none !important; }
    .hidden { display: none !important; }

    @media (max-width: 600px) {
      header { padding: 1.1rem 1.25rem; }
      main { padding-top: 5rem; padding-left: 0.6rem; padding-right: 0.6rem; columns: 2 140px; column-gap: 0.5rem; }
      .card-quote blockquote { font-size: 0.95rem; }
      .lb-feed { padding: 4.5rem 1.25rem 3rem; }
      .lb-item blockquote { font-size: 1.4rem; }
      .lb-item .lb-thought { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="site-title">Noctiluca</div>
  <nav><a href="/post.html">+ Add</a></nav>
</header>

<main id="grid"></main>

<!-- Edit overlay — full screen bottom sheet -->
<div class="edit-overlay" id="edit-overlay" onclick="handleOverlayClick(event)">
  <div class="edit-sheet" id="edit-sheet">
    <div id="edit-sheet-content"></div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lb-header">
    <span class="lb-counter" id="lb-counter"></span>
    <div class="lb-nav">
      <button class="lb-arrow" id="lb-prev" onclick="navigateLb(-1)" title="Previous">&#8592;</button>
      <button class="lb-arrow" id="lb-next" onclick="navigateLb(1)"  title="Next">&#8594;</button>
      <button class="lb-close" onclick="closeLightbox()" title="Back to grid">✕</button>
    </div>
  </div>
  <div class="lb-feed" id="lb-feed"></div>
</div>

<script>
  let allPosts = [];
  let currentIndex = 0;
  const isAdmin = () => sessionStorage.getItem('nc_auth') === '1';

  async function loadPosts() {
    const grid = document.getElementById('grid');
    try {
      const res = await fetch('/posts.json?t=' + Date.now());
      allPosts = await res.json();
      if (!allPosts.length) {
        grid.innerHTML = '<div class="empty">Nothing here yet.</div>';
        return;
      }
      allPosts.sort((a, b) => new Date(b.date) - new Date(a.date));
      renderGrid();
    } catch(e) {
      grid.innerHTML = '<div class="empty">Could not load posts.</div>';
    }
  }

  function fmtDate(d) {
    return d ? new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
  }

  function renderGrid() {
    document.getElementById('grid').innerHTML = allPosts.map((post, i) => {
      if (post.type === 'image') return `
        <div class="card card-image" onclick="openLightbox(${i})">
          <img src="${post.content}" alt="${post.caption||''}" loading="lazy" />
          ${post.caption ? `<p class="caption">${post.caption}</p>` : ''}
        </div>`;
      if (post.type === 'quote') return `
        <div class="card card-quote" onclick="openLightbox(${i})">
          <blockquote>${post.content}</blockquote>
          ${post.attribution ? `<cite>— ${post.attribution}</cite>` : ''}
        </div>`;
      if (post.type === 'thought') return `
        <div class="card card-thought" onclick="openLightbox(${i})">
          <p>${post.content}</p>
        </div>`;
      if (post.type === 'video') return `
        <div class="card card-video" onclick="openLightbox(${i})">
          <div class="thumb">
            <div class="play-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--gold)"><polygon points="5,3 19,12 5,21"/></svg>
            </div>
          </div>
          ${post.caption ? `<p class="caption">${post.caption}</p>` : ''}
        </div>`;
      return '';
    }).join('');
  }

  function openLightbox(index) {
    currentIndex = index;
    renderFeed();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
    scrollToItem(index, 'instant');
    updateNav();
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function navigateLb(dir) {
    const newIndex = currentIndex + dir;
    if (newIndex < 0 || newIndex >= allPosts.length) return;
    currentIndex = newIndex;
    scrollToItem(currentIndex, 'smooth');
    updateNav();
  }

  function updateNav() {
    document.getElementById('lb-prev').disabled = currentIndex === 0;
    document.getElementById('lb-next').disabled = currentIndex === allPosts.length - 1;
    document.getElementById('lb-counter').textContent = `${currentIndex + 1} / ${allPosts.length}`;
  }

  function scrollToItem(index, behavior) {
    const item = document.getElementById(`lb-item-${index}`);
    if (item) item.scrollIntoView({ behavior, block: 'start' });
  }

  function renderFeed() {
    const admin = isAdmin();
    document.getElementById('lb-feed').innerHTML = allPosts.map((post, i) => {
      const date = fmtDate(post.date);
      const meta = `<div class="lb-meta">
        <span class="lb-tag">${post.type}</span>
        ${date ? `<span class="lb-date">${date}</span>` : ''}
      </div>`;

      let content = '';
      if (post.type === 'quote') {
        content = `<blockquote>${post.content}</blockquote>
          ${post.attribution ? `<cite>— ${post.attribution}</cite>` : ''}`;
      } else if (post.type === 'thought') {
        content = `<p class="lb-thought">${post.content}</p>`;
      } else if (post.type === 'image') {
        content = `<img src="${post.content}" alt="${post.caption||''}" loading="lazy" />
          ${post.caption ? `<p class="lb-caption">${post.caption}</p>` : ''}`;
      } else if (post.type === 'video') {
        content = `<div class="lb-video-wrapper">
            <iframe src="${post.content}" allowfullscreen></iframe>
          </div>
          ${post.caption ? `<p class="lb-caption">${post.caption}</p>` : ''}`;
      }

      const actions = admin ? `
        <div class="lb-actions">
          <button class="btn-edit" onclick="toggleEdit(${i})">Edit</button>
          <button class="btn-delete" onclick="showConfirm(${i})">Delete</button>
          <div class="lb-confirm" id="confirm-${i}">
            Delete this post?
            <button class="yes" onclick="doDelete(${i})">Yes, delete</button>
            <button class="no" onclick="hideConfirm(${i})">Cancel</button>
          </div>
        </div>` : '';

      return `<div class="lb-item" id="lb-item-${i}">${meta}${content}${actions}</div>`;
    }).join('');

    const feed = document.getElementById('lb-feed');
    feed.addEventListener('scroll', onFeedScroll, { passive: true });
  }

  let scrollTimer;
  function onFeedScroll() {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const feed = document.getElementById('lb-feed');
      const items = feed.querySelectorAll('.lb-item');
      let closest = 0, minDist = Infinity;
      items.forEach((el, i) => {
        const dist = Math.abs(el.getBoundingClientRect().top - 100);
        if (dist < minDist) { minDist = dist; closest = i; }
      });
      if (closest !== currentIndex) { currentIndex = closest; updateNav(); }
    }, 80);
  }

  function buildEditForm(post, i) {
    const isText = post.type === 'thought' || post.type === 'quote';
    return `
      <div class="ef-group">
        <label class="ef-label">Type</label>
        <select class="ef-select" id="ef-type-${i}" onchange="updateEfFields(${i})">
          <option value="thought" ${post.type==='thought'?'selected':''}>Thought</option>
          <option value="quote"   ${post.type==='quote'  ?'selected':''}>Quote</option>
          <option value="image"   ${post.type==='image'  ?'selected':''}>Image</option>
          <option value="video"   ${post.type==='video'  ?'selected':''}>Video</option>
        </select>
      </div>
      <div class="ef-group">
        <label class="ef-label" id="ef-cl-${i}">Content</label>
        <textarea class="ef-textarea" id="ef-text-${i}" ${!isText?'style="display:none"':''}>${isText?post.content:''}</textarea>
        <input type="text" class="ef-input" id="ef-url-${i}" value="${!isText?post.content:''}" ${isText?'style="display:none"':''} placeholder="URL..." />
      </div>
      <div class="ef-group" id="ef-ag-${i}" ${post.type!=='quote'?'style="display:none"':''}>
        <label class="ef-label">Attribution</label>
        <input type="text" class="ef-input" id="ef-attr-${i}" value="${post.attribution||''}" placeholder="Alan Watts..." />
      </div>
      <div class="ef-group" id="ef-cg-${i}" ${(post.type!=='image'&&post.type!=='video')?'style="display:none"':''}>
        <label class="ef-label">Caption</label>
        <input type="text" class="ef-input" id="ef-cap-${i}" value="${post.caption||''}" placeholder="Optional..." />
      </div>
      <div class="ef-group">
        <label class="ef-label">Date</label>
        <input type="date" class="ef-input" id="ef-date-${i}" value="${post.date||''}" />
      </div>
      <div class="ef-row">
        <button class="ef-save" onclick="saveEdit(${i})">Save</button>
        <button class="ef-cancel" onclick="closeEditOverlay()">Cancel</button>
      </div>
      <div class="ef-notice" id="ef-notice-${i}"></div>`;
  }

  function updateEfFields(i) {
    const type = document.getElementById(`ef-type-${i}`).value;
    const textarea = document.getElementById(`ef-text-${i}`);
    const urlInput = document.getElementById(`ef-url-${i}`);
    const ag = document.getElementById(`ef-ag-${i}`);
    const cg = document.getElementById(`ef-cg-${i}`);
    textarea.style.display = (type==='thought'||type==='quote') ? '' : 'none';
    urlInput.style.display  = (type==='image'||type==='video')  ? '' : 'none';
    ag.style.display = type==='quote' ? '' : 'none';
    cg.style.display = (type==='image'||type==='video') ? '' : 'none';
  }

  let currentEditIndex = null;

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('edit-overlay')) closeEditOverlay();
  }

  function closeEditOverlay() {
    document.getElementById('edit-overlay').classList.remove('open');
    currentEditIndex = null;
  }

  function toggleEdit(i) {
    hideConfirm(i);
    currentEditIndex = i;
    const post = allPosts[i];
    document.getElementById('edit-sheet-content').innerHTML = buildEditForm(post, i);
    document.getElementById('edit-overlay').classList.add('open');
  }

  function showConfirm(i) {
    document.getElementById(`confirm-${i}`).classList.add('visible');
  }

  function hideConfirm(i) {
    const el = document.getElementById(`confirm-${i}`);
    if (el) el.classList.remove('visible');
  }

  async function saveEdit(i) {
    const post = allPosts[i];
    const type = document.getElementById(`ef-type-${i}`).value;
    const isText = type==='thought'||type==='quote';
    const content = isText
      ? document.getElementById(`ef-text-${i}`).value.trim()
      : document.getElementById(`ef-url-${i}`).value.trim();

    const res = await fetch('/api/post', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'edit', id: post.id, type, content,
        date: document.getElementById(`ef-date-${i}`).value,
        attribution: document.getElementById(`ef-attr-${i}`)?.value?.trim()||'',
        caption: document.getElementById(`ef-cap-${i}`)?.value?.trim()||'',
        password: sessionStorage.getItem('nc_pw'),
      }),
    });

    const notice = document.getElementById(`ef-notice-${i}`);
    if (res.ok) {
      notice.textContent = '✓ Saved — reloading...';
      notice.className = 'ef-notice success';
      notice.style.display = 'block';
      setTimeout(() => { closeEditOverlay(); closeLightbox(); loadPosts(); }, 1500);
    } else {
      notice.textContent = res.status===401 ? 'Session expired — re-enter passphrase at /post.html' : 'Could not save. Try again.';
      notice.className = 'ef-notice error';
      notice.style.display = 'block';
    }
  }

  async function doDelete(i) {
    const post = allPosts[i];
    const res = await fetch('/api/post', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', id: post.id, password: sessionStorage.getItem('nc_pw') }),
    });
    if (res.ok) {
      allPosts.splice(i, 1);
      closeLightbox();
      renderGrid();
    }
  }

  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowRight') navigateLb(1);
    if (e.key === 'ArrowLeft')  navigateLb(-1);
  });

  let touchStartX = 0;
  document.getElementById('lightbox').addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  document.getElementById('lightbox').addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) navigateLb(diff > 0 ? 1 : -1);
  }, { passive: true });

  loadPosts();
</script>
</body>
</html>
