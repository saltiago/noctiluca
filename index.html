<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noctiluca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #111009;
      --bg-card: #1a1814;
      --text: #e8e0cc;
      --text-muted: #8a8070;
      --gold: #c8a96e;
      --gold-dim: #7a6540;
      --border: #2a2620;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.5rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, var(--bg) 60%, transparent);
    }

    .site-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
    }

    nav a {
      font-family: 'Inconsolata', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    nav a:hover { color: var(--gold); }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 7rem 2rem 6rem;
    }

    .empty {
      text-align: center;
      padding: 6rem 2rem;
      font-family: 'Inconsolata', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .post {
      padding: 2.5rem 0;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.4s ease both;
    }

    .post:first-child { border-top: 1px solid var(--border); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .post-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .tag {
      font-family: 'Inconsolata', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-dim);
      border: 1px solid var(--gold-dim);
      padding: 0.15rem 0.5rem;
      border-radius: 2px;
    }

    .date {
      font-family: 'Inconsolata', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    blockquote {
      font-size: 1.55rem;
      font-weight: 300;
      font-style: italic;
      line-height: 1.5;
      padding-left: 1.5rem;
      border-left: 1px solid var(--gold-dim);
    }

    cite {
      display: block;
      margin-top: 1rem;
      padding-left: 1.5rem;
      font-family: 'Inconsolata', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-style: normal;
    }

    .thought {
      font-size: 1.15rem;
      font-weight: 300;
      line-height: 1.8;
    }

    .post img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 2px;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 2px;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .caption {
      margin-top: 0.75rem;
      font-family: 'Inconsolata', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    footer {
      text-align: center;
      padding: 3rem 2rem;
      font-family: 'Inconsolata', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 600px) {
      header { padding: 1.25rem 1.5rem; }
      main { padding-left: 1.5rem; padding-right: 1.5rem; }
      blockquote { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="site-title">Noctiluca</div>
    <nav><a href="/post.html">+ Add</a></nav>
  </header>

  <main id="feed"></main>

  <footer>A personal collection &mdash; ongoing</footer>

  <script>
    async function loadPosts() {
      const feed = document.getElementById('feed');
      try {
        const res = await fetch('/posts.json');
        const posts = await res.json();

        if (!posts.length) {
          feed.innerHTML = '<div class="empty">Nothing here yet.</div>';
          return;
        }

        posts.sort((a, b) => new Date(b.date) - new Date(a.date));

        feed.innerHTML = posts.map((post, i) => {
          const date = post.date
            ? new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
            : '';

          const meta = `<div class="post-meta">
            <span class="tag">${post.type}</span>
            ${date ? `<span class="date">${date}</span>` : ''}
          </div>`;

          let content = '';
          if (post.type === 'quote') {
            content = `<blockquote>${post.content}</blockquote>
              ${post.attribution ? `<cite>— ${post.attribution}</cite>` : ''}`;
          } else if (post.type === 'thought') {
            content = `<p class="thought">${post.content}</p>`;
          } else if (post.type === 'image') {
            content = `<img src="${post.content}" alt="${post.caption || ''}" loading="lazy" />
              ${post.caption ? `<p class="caption">${post.caption}</p>` : ''}`;
          } else if (post.type === 'video') {
            content = `<div class="video-wrapper">
                <iframe src="${post.content}" allowfullscreen></iframe>
              </div>
              ${post.caption ? `<p class="caption">${post.caption}</p>` : ''}`;
          }

          return `<article class="post" style="animation-delay:${i * 0.05}s">${meta}${content}</article>`;
        }).join('');
      } catch(e) {
        feed.innerHTML = '<div class="empty">Could not load posts.</div>';
      }
    }

    loadPosts();
  </script>

</body>
</html>
