<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noctiluca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #111009;
      --card: #1c1a14;
      --text: #ede5d0;
      --muted: #9a9080;
      --gold: #c8a96e;
      --gold2: #7a6540;
      --border: #2a2620;
      --red: #c87070;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:var(--bg); color:var(--text);
      font-family:'Cormorant Garamond',Georgia,serif;
      font-weight:300; line-height:1.7; min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    a { color:inherit; text-decoration:none; }

    /* HEADER */
    header {
      position:fixed; top:0; left:0; right:0; z-index:100;
      padding:1.4rem 2rem;
      display:flex; align-items:center; justify-content:space-between;
      background:linear-gradient(to bottom,var(--bg) 55%,transparent);
    }
    .logo {
      font-size:1rem; font-weight:400; letter-spacing:.28em;
      text-transform:uppercase; color:var(--gold);
    }
    .nav-add {
      font-family:'Inconsolata',monospace; font-size:.68rem;
      letter-spacing:.15em; text-transform:uppercase; color:var(--muted);
      transition:color .2s;
    }
    .nav-add:hover { color:var(--gold); }

    /* GRID */
    main {
      padding:5.5rem 1.25rem 4rem;
      columns:3 280px; column-gap:.75rem;
    }
    .card {
      break-inside:avoid; margin-bottom:.75rem;
      background:var(--card); border-radius:3px;
      overflow:hidden; cursor:pointer;
      transition:opacity .2s, transform .2s;
    }
    .card:hover { opacity:.85; transform:translateY(-2px); }

    .card img { width:100%; display:block; }
    .card .cap {
      padding:.6rem .85rem .75rem;
      font-family:'Inconsolata',monospace; font-size:.65rem;
      letter-spacing:.08em; color:var(--muted);
    }
    .card-q {
      padding:1.5rem 1.25rem 1.4rem;
      border-left:2px solid var(--gold2);
    }
    .card-q blockquote {
      font-size:1.1rem; font-style:italic;
      font-weight:300; line-height:1.55; color:var(--text);
    }
    .card-q cite {
      display:block; margin-top:.75rem;
      font-family:'Inconsolata',monospace; font-size:.6rem;
      letter-spacing:.12em; text-transform:uppercase;
      color:var(--muted); font-style:normal;
    }
    .card-t { padding:1.4rem 1.25rem; }
    .card-t p { font-size:1rem; font-weight:300; line-height:1.75; }
    .card-v .thumb {
      width:100%; aspect-ratio:16/9;
      background:#1a1814; display:flex;
      align-items:center; justify-content:center;
    }
    .play {
      width:40px; height:40px; border-radius:50%;
      background:rgba(200,169,110,.12); border:1px solid var(--gold2);
      display:flex; align-items:center; justify-content:center;
    }
    .empty {
      column-span:all; text-align:center; padding:6rem 2rem;
      font-family:'Inconsolata',monospace; font-size:.7rem;
      letter-spacing:.15em; text-transform:uppercase; color:var(--muted);
    }

    /* LIGHTBOX */
    #lb {
      display:none; position:fixed; inset:0; z-index:500;
      background:rgba(10,9,7,.96); flex-direction:column;
    }
    #lb.open { display:flex; }
    #lb-hdr {
      position:absolute; top:0; left:0; right:0; z-index:10;
      padding:1.2rem 2rem;
      display:flex; align-items:center; justify-content:space-between;
      background:linear-gradient(to bottom,rgba(10,9,7,.95) 60%,transparent);
    }
    #lb-counter {
      font-family:'Inconsolata',monospace; font-size:.65rem;
      letter-spacing:.12em; color:var(--muted);
    }
    .lb-nav { display:flex; align-items:center; gap:1rem; }
    .lb-btn {
      background:none; border:none; color:var(--muted);
      cursor:pointer; font-size:1.1rem; line-height:1;
      padding:.25rem; transition:color .2s;
    }
    .lb-btn:hover { color:var(--gold); }
    .lb-btn:disabled { opacity:.2; cursor:default; }
    #lb-feed {
      flex:1; overflow-y:auto;
      padding:5rem 2rem 4rem;
      scroll-behavior:smooth;
      -webkit-overflow-scrolling:touch;
    }
    .lb-post {
      max-width:680px; margin:0 auto;
      padding:2.5rem 0; border-bottom:1px solid var(--border);
    }
    .lb-post:first-child { border-top:1px solid var(--border); }
    .lb-meta { display:flex; align-items:center; gap:.75rem; margin-bottom:1.25rem; }
    .lb-tag {
      font-family:'Inconsolata',monospace; font-size:.65rem;
      letter-spacing:.2em; text-transform:uppercase;
      color:var(--gold2); border:1px solid var(--gold2);
      padding:.15rem .5rem; border-radius:2px;
    }
    .lb-date {
      font-family:'Inconsolata',monospace; font-size:.65rem;
      letter-spacing:.1em; color:var(--muted);
    }
    .lb-post img { width:100%; height:auto; display:block; border-radius:2px; }
    .lb-post blockquote {
      font-size:1.9rem; font-style:italic; font-weight:300;
      line-height:1.45; padding-left:1.5rem; border-left:1px solid var(--gold2);
    }
    .lb-post cite {
      display:block; margin-top:1rem; padding-left:1.5rem;
      font-family:'Inconsolata',monospace; font-size:.7rem;
      letter-spacing:.12em; text-transform:uppercase;
      color:var(--muted); font-style:normal;
    }
    .lb-thought { font-size:1.3rem; font-weight:300; line-height:1.8; }
    .lb-cap {
      margin-top:.85rem; font-family:'Inconsolata',monospace;
      font-size:.7rem; letter-spacing:.08em; color:var(--muted);
    }
    .lb-vid { position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:2px; }
    .lb-vid iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }

    /* ADMIN ACTIONS in lightbox */
    .lb-actions {
      display:flex; gap:.75rem; margin-top:1.5rem;
      padding-top:1.25rem; border-top:1px solid var(--border);
      align-items:center; flex-wrap:wrap;
    }
    .lb-actions.off { display:none; }
    .btn-e {
      background:transparent; border:1px solid var(--gold2); color:var(--gold);
      font-family:'Inconsolata',monospace; font-size:.62rem;
      letter-spacing:.15em; text-transform:uppercase;
      padding:.45rem 1rem; cursor:pointer; border-radius:2px; transition:all .2s;
    }
    .btn-e:hover { background:var(--gold2); color:var(--bg); }
    .btn-d {
      background:transparent; border:1px solid #7a3030; color:var(--red);
      font-family:'Inconsolata',monospace; font-size:.62rem;
      letter-spacing:.15em; text-transform:uppercase;
      padding:.45rem 1rem; cursor:pointer; border-radius:2px; transition:all .2s;
    }
    .btn-d:hover { background:#7a3030; color:var(--bg); }
    .lb-confirm {
      display:none; align-items:center; gap:.75rem;
      width:100%; margin-top:.25rem;
      font-family:'Inconsolata',monospace; font-size:.62rem;
      letter-spacing:.08em; color:var(--red);
    }
    .lb-confirm.on { display:flex; }
    .lb-confirm button {
      background:none; border:none; cursor:pointer; padding:0;
      font-family:'Inconsolata',monospace; font-size:.62rem;
      letter-spacing:.08em; text-transform:uppercase;
    }
    .lb-confirm .cy { color:var(--red); text-decoration:underline; }
    .lb-confirm .cn { color:var(--muted); }

    /* EDIT OVERLAY — rendered outside lightbox, always full viewport */
    #edit-overlay {
      display:none; position:fixed; inset:0; z-index:900;
      background:rgba(0,0,0,.6);
      align-items:flex-end; justify-content:center;
    }
    #edit-overlay.open { display:flex; }
    #edit-sheet {
      background:#1c1a14;
      border-top:1px solid var(--border);
      border-radius:14px 14px 0 0;
      padding:1.75rem 1.5rem 2.5rem;
      width:100%; max-width:680px;
      max-height:88vh; overflow-y:auto;
      box-shadow:0 -8px 40px rgba(0,0,0,.8);
      animation:sheetUp .25s ease;
    }
    @keyframes sheetUp {
      from { transform:translateY(80px); opacity:0; }
      to   { transform:translateY(0);    opacity:1; }
    }
    .ef-title {
      font-family:'Inconsolata',monospace; font-size:.75rem;
      letter-spacing:.2em; text-transform:uppercase;
      color:var(--gold); margin-bottom:1.25rem;
    }
    .ef-g { margin-bottom:1rem; }
    .ef-l {
      display:block; font-family:'Inconsolata',monospace;
      font-size:.6rem; letter-spacing:.2em; text-transform:uppercase;
      color:var(--muted); margin-bottom:.4rem;
    }
    .ef-g input, .ef-g select, .ef-g textarea {
      width:100%; background:var(--bg);
      border:1px solid var(--border); color:var(--text);
      font-family:'Cormorant Garamond',serif; font-size:1rem;
      font-weight:300; padding:.65rem .9rem;
      border-radius:2px; outline:none; -webkit-appearance:none;
    }
    .ef-g textarea { resize:vertical; min-height:100px; line-height:1.7; }
    .ef-row { display:flex; gap:.75rem; margin-top:1.1rem; }
    .ef-save {
      background:transparent; border:1px solid var(--gold2); color:var(--gold);
      font-family:'Inconsolata',monospace; font-size:.65rem;
      letter-spacing:.15em; text-transform:uppercase;
      padding:.6rem 1.25rem; cursor:pointer; border-radius:2px; transition:all .2s;
    }
    .ef-save:hover { background:var(--gold2); color:var(--bg); }
    .ef-cancel {
      background:transparent; border:1px solid var(--border); color:var(--muted);
      font-family:'Inconsolata',monospace; font-size:.65rem;
      letter-spacing:.15em; text-transform:uppercase;
      padding:.6rem .9rem; cursor:pointer; border-radius:2px;
    }
    .ef-msg {
      margin-top:.75rem; font-family:'Inconsolata',monospace;
      font-size:.65rem; letter-spacing:.08em; display:none;
    }
    .ef-msg.ok  { color:var(--gold); display:block; }
    .ef-msg.err { color:var(--red);  display:block; }

    @media (max-width:600px) {
      header { padding:1.1rem 1.25rem; }
      main { padding-top:5rem; padding-left:.6rem; padding-right:.6rem; columns:2 140px; column-gap:.5rem; }
      .card-q blockquote { font-size:.95rem; }
      #lb-feed { padding:4.5rem 1.25rem 3rem; }
      .lb-post blockquote { font-size:1.4rem; }
      .lb-thought { font-size:1.1rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Noctiluca</div>
  <a class="nav-add" href="/post.html">+ Add</a>
</header>

<main id="grid"></main>

<!-- Edit overlay — lives outside lightbox so it's always full-screen -->
<div id="edit-overlay">
  <div id="edit-sheet">
    <div id="edit-body"></div>
  </div>
</div>

<!-- Lightbox -->
<div id="lb">
  <div id="lb-hdr">
    <span id="lb-counter"></span>
    <div class="lb-nav">
      <button class="lb-btn" id="lb-prev" onclick="nav(-1)">&#8592;</button>
      <button class="lb-btn" id="lb-next" onclick="nav(1)">&#8594;</button>
      <button class="lb-btn" onclick="closeLb()">✕</button>
    </div>
  </div>
  <div id="lb-feed"></div>
</div>

<script>
var posts = [];
var cur = 0;
var editIdx = null;

function admin() { return sessionStorage.getItem('nc_auth') === '1'; }
function pw()    { return sessionStorage.getItem('nc_pw'); }

function fmt(d) {
  return d ? new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) : '';
}

/* ── Load posts ── */
async function load() {
  var g = document.getElementById('grid');
  try {
    var r = await fetch('/posts.json?t='+Date.now());
    posts = await r.json();
    if (!posts.length) { g.innerHTML='<div class="empty">Nothing here yet.</div>'; return; }
    posts.sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
    renderGrid();
  } catch(e) { g.innerHTML='<div class="empty">Could not load posts.</div>'; }
}

function renderGrid() {
  document.getElementById('grid').innerHTML = posts.map(function(p,i) {
    if (p.type==='image') return '<div class="card" onclick="openLb('+i+')"><img src="'+p.content+'" loading="lazy" />'+(p.caption?'<p class="cap">'+p.caption+'</p>':'')+'</div>';
    if (p.type==='quote') return '<div class="card card-q" onclick="openLb('+i+')"><blockquote>'+p.content+'</blockquote>'+(p.attribution?'<cite>— '+p.attribution+'</cite>':'')+'</div>';
    if (p.type==='thought') return '<div class="card card-t" onclick="openLb('+i+')"><p>'+p.content+'</p></div>';
    if (p.type==='video') return '<div class="card card-v" onclick="openLb('+i+')"><div class="thumb"><div class="play"><svg width="14" height="14" viewBox="0 0 24 24" fill="var(--gold)"><polygon points="5,3 19,12 5,21"/></svg></div></div>'+(p.caption?'<p class="cap">'+p.caption+'</p>':'')+'</div>';
    return '';
  }).join('');
}

/* ── Lightbox ── */
function openLb(i) {
  cur = i;
  renderFeed();
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow='hidden';
  scrollTo(i,'instant');
  updateNav();
}

function closeLb() {
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow='';
}

function nav(d) {
  var n = cur+d;
  if (n<0||n>=posts.length) return;
  cur=n; scrollTo(cur,'smooth'); updateNav();
}

function updateNav() {
  document.getElementById('lb-prev').disabled = cur===0;
  document.getElementById('lb-next').disabled = cur===posts.length-1;
  document.getElementById('lb-counter').textContent = (cur+1)+' / '+posts.length;
}

function scrollTo(i, b) {
  var el = document.getElementById('lp'+i);
  if (el) el.scrollIntoView({behavior:b, block:'start'});
}

function renderFeed() {
  var adm = admin();
  document.getElementById('lb-feed').innerHTML = posts.map(function(p,i) {
    var d = fmt(p.date);
    var meta = '<div class="lb-meta"><span class="lb-tag">'+p.type+'</span>'+(d?'<span class="lb-date">'+d+'</span>':'')+'</div>';
    var body = '';
    if (p.type==='quote')   body='<blockquote>'+p.content+'</blockquote>'+(p.attribution?'<cite>— '+p.attribution+'</cite>':'');
    if (p.type==='thought') body='<p class="lb-thought">'+p.content+'</p>';
    if (p.type==='image')   body='<img src="'+p.content+'" loading="lazy" />'+(p.caption?'<p class="lb-cap">'+p.caption+'</p>':'');
    if (p.type==='video')   body='<div class="lb-vid"><iframe src="'+p.content+'" allowfullscreen></iframe></div>'+(p.caption?'<p class="lb-cap">'+p.caption+'</p>':'');
    var actions = adm ? '<div class="lb-actions"><button class="btn-e" onclick="editPost('+i+')">Edit</button><button class="btn-d" onclick="askDel('+i+')">Delete</button><div class="lb-confirm" id="conf'+i+'">Delete this post? <button class="cy" onclick="doDel('+i+')">Yes, delete</button> <button class="cn" onclick="noConf('+i+')">Cancel</button></div></div>' : '';
    return '<div class="lb-post" id="lp'+i+'">'+meta+body+actions+'</div>';
  }).join('');

  var feed = document.getElementById('lb-feed');
  feed.onscroll = function() {
    clearTimeout(feed._t);
    feed._t = setTimeout(function() {
      var items = feed.querySelectorAll('.lb-post');
      var best=0, bestD=Infinity;
      items.forEach(function(el,i){ var d=Math.abs(el.getBoundingClientRect().top-100); if(d<bestD){bestD=d;best=i;} });
      if (best!==cur){cur=best;updateNav();}
    }, 80);
  };
}

/* ── Delete ── */
function askDel(i) {
  var c = document.getElementById('conf'+i);
  if (c) c.classList.add('on');
}
function noConf(i) {
  var c = document.getElementById('conf'+i);
  if (c) c.classList.remove('on');
}
async function doDel(i) {
  var p = posts[i];
  var r = await fetch('/api/post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',id:p.id,password:pw()})});
  if (r.ok) { posts.splice(i,1); closeLb(); renderGrid(); }
}

/* ── Edit overlay ── */
function editPost(i) {
  editIdx = i;
  var p = posts[i];
  var isText = p.type==='thought'||p.type==='quote';
  document.getElementById('edit-body').innerHTML =
    '<p class="ef-title">Edit Entry</p>'+
    '<div class="ef-g"><label class="ef-l">Type</label>'+
    '<select id="ef-type" onchange="efFields()">'+
      '<option value="thought"'+(p.type==='thought'?' selected':'')+'>Thought</option>'+
      '<option value="quote"'+(p.type==='quote'?' selected':'')+'>Quote</option>'+
      '<option value="image"'+(p.type==='image'?' selected':'')+'>Image</option>'+
      '<option value="video"'+(p.type==='video'?' selected':'')+'>Video</option>'+
    '</select></div>'+
    '<div class="ef-g"><label class="ef-l" id="ef-cl">Content</label>'+
    '<textarea id="ef-text" '+(isText?'':'style="display:none"')+'>'+( isText?p.content:'' )+'</textarea>'+
    '<input type="text" id="ef-url" value="'+(isText?'':p.content)+'" '+(isText?'style="display:none"':'')+' placeholder="URL..." /></div>'+
    '<div class="ef-g" id="ef-ag" '+(p.type==='quote'?'':'style="display:none"')+'><label class="ef-l">Attribution</label><input type="text" id="ef-attr" value="'+(p.attribution||'')+'" placeholder="Alan Watts..." /></div>'+
    '<div class="ef-g" id="ef-cg" '+((p.type==='image'||p.type==='video')?'':'style="display:none"')+'><label class="ef-l">Caption</label><input type="text" id="ef-cap" value="'+(p.caption||'')+'" placeholder="Optional..." /></div>'+
    '<div class="ef-g"><label class="ef-l">Date</label><input type="date" id="ef-date" value="'+(p.date||'')+'" /></div>'+
    '<div class="ef-row"><button class="ef-save" onclick="saveEdit()">Save</button><button class="ef-cancel" onclick="closeEdit()">Cancel</button></div>'+
    '<div class="ef-msg" id="ef-msg"></div>';
  document.getElementById('edit-overlay').classList.add('open');
}

function efFields() {
  var t = document.getElementById('ef-type').value;
  document.getElementById('ef-text').style.display = (t==='thought'||t==='quote')?'':'none';
  document.getElementById('ef-url').style.display  = (t==='image'||t==='video')?'':'none';
  document.getElementById('ef-ag').style.display   = t==='quote'?'':'none';
  document.getElementById('ef-cg').style.display   = (t==='image'||t==='video')?'':'none';
  document.getElementById('ef-cl').textContent = {thought:'Thought',quote:'Quote text',image:'Image URL',video:'YouTube embed URL'}[t];
}

function closeEdit() {
  document.getElementById('edit-overlay').classList.remove('open');
  editIdx = null;
}

document.getElementById('edit-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeEdit();
});

async function saveEdit() {
  if (editIdx === null) return;
  var p = posts[editIdx];
  var t = document.getElementById('ef-type').value;
  var isText = t==='thought'||t==='quote';
  var content = isText ? document.getElementById('ef-text').value.trim() : document.getElementById('ef-url').value.trim();
  var msg = document.getElementById('ef-msg');
  msg.className = 'ef-msg';

  var r = await fetch('/api/post',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      action:'edit', id:p.id, type:t, content:content,
      date: document.getElementById('ef-date').value,
      attribution: (document.getElementById('ef-attr')||{value:''}).value.trim(),
      caption:     (document.getElementById('ef-cap') ||{value:''}).value.trim(),
      password: pw()
    })
  });

  if (r.ok) {
    msg.textContent='✓ Saved — reloading...';
    msg.className='ef-msg ok';
    setTimeout(function(){ closeEdit(); closeLb(); load(); }, 1500);
  } else if (r.status===401) {
    msg.textContent='Session expired — re-enter passphrase at /post.html';
    msg.className='ef-msg err';
  } else {
    msg.textContent='Could not save. Try again.';
    msg.className='ef-msg err';
  }
}

/* ── Keyboard / swipe ── */
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('lb').classList.contains('open')) return;
  if (e.key==='Escape') closeLb();
  if (e.key==='ArrowRight') nav(1);
  if (e.key==='ArrowLeft')  nav(-1);
});

var tx=0;
document.getElementById('lb').addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
document.getElementById('lb').addEventListener('touchend',function(e){var d=tx-e.changedTouches[0].clientX;if(Math.abs(d)>50)nav(d>0?1:-1);},{passive:true});

load();
</script>
</body>
</html>
